name: Trigger E2E Tests

on:
  workflow_run:
    workflows: [ "CI - Build & Push Docker Image" ]
    types:
      - completed
    branches:
      - staging
      - dev
  pull_request:
    branches:
      - staging
      - dev
  workflow_dispatch:

jobs:
  trigger-e2e:


  
    name: Trigger E2E Test in e2e repo
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Get short SHA
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            FULL_SHA="${{ github.event.workflow_run.head_sha }}"
          else
            FULL_SHA="${{ github.event.pull_request.head.sha }}"
          fi
          echo "full_sha=$FULL_SHA" >> $GITHUB_OUTPUT
          echo "sha_short=$(echo $FULL_SHA | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Wait for build workflow to complete
        if: ${{ github.event_name == 'pull_request' }}
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ steps.vars.outputs.full_sha }}
          check-name: 'Build and Push Docker image'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 15
          allowed-conclusions: success

      - name: Trigger E2E workflow and wait for result
        uses: convictional/trigger-workflow-and-wait@v1.6.5
        with:
          owner: it-mentor-community-platform
          repo: e2e-tests
          github_token: '${{ secrets.E2E_TRIGGER_TOKEN }}'
          workflow_file_name: ci.yml
          ref: dev
          client_payload: |
            {
              "mentor_service_tag": "sha-${{ steps.vars.outputs.sha_short }}"
            }
          propagate_failure: true
          trigger_workflow: true
          wait_workflow: true
          wait_interval: 15
