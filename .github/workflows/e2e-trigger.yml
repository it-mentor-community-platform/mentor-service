name: Trigger E2E Tests

on:
  workflow_run:
    workflows: [ "CI - Build & Push Docker Image" ]
    types:
      - completed
    branches:
      - staging
      - dev
  workflow_dispatch:

jobs:
  trigger-e2e:
    name: Trigger E2E Test in e2e repo
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Get short SHA
        id: vars
        run: |
          SHA_SHORT=$(echo "${{ github.event.workflow_run.head_sha }}" | cut -c1-7)
          echo "sha_short=$SHA_SHORT" >> $GITHUB_OUTPUT

      - name: Trigger E2E workflow and wait for result
        uses: convictional/trigger-workflow-and-wait@v1.6.5
        with:
          owner: it-mentor-community-platform
          repo: e2e-tests
          github_token: '${{ secrets.E2E_TRIGGER_TOKEN }}'
          workflow_file_name: ci.yml
          ref: dev
          client_payload: |
            {
              "mentor_service_tag": "sha-${{ steps.vars.outputs.sha_short }}"
            }
          propagate_failure: true
          trigger_workflow: true
          wait_workflow: true
          wait_interval: 15
