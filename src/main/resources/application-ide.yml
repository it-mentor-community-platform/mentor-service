server:
  port: 8085


spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/it_mentor_community_platform
    username: root
    password: password
    driver-class-name: org.postgresql.Driver


management:
  metrics:
    tags:
      application: ${spring.application.name}
  endpoints:
    web:
      exposure:
        include:
          - health
          - prometheus
          - info

mentorservice:
  profile-service-base-url: "http://localhost:8083"