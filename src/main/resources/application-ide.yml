server:
  port: 8085

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/it_mentor_community_platform?currentSchema=mentor_service
    username: root
    password: password
    driver-class-name: org.postgresql.Driver

  kafka:
    bootstrap-servers: localhost:29092
    topic:
      auth-user-authenticated: auth.user.authenticated
      projects-project-created: projects.project.created
      notification-mentors-project-submitted: notifications.mentors.project.submitted
management:
  metrics:
    tags:
      application: ${spring.application.name}
  endpoints:
    web:
      exposure:
        include:
          - health
          - prometheus
          - info

mentorservice:
  profile-service-base-url: "http://localhost:8083"